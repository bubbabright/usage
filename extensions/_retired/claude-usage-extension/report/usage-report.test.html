const GENERATED_AT = 1783281547452;
// --------------------------------------------------------------------------

const COLORS = { five_hour: "#E69F00", seven_day: "#56B4E9" };
const LABELS = { five_hour: "5-Hour", seven_day: "7-Day" };
const PAD = { top: 16, right: 16, bottom: 28, left: 40 };

const state = {
  rangeMs: 604800000,          // default: 7 days
  visible: { five_hour: true, seven_day: true },
  showTrend: true,             // overlay computed moving-average trend line
  points: [],                  // filtered to range, time-sorted
};

const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");
const tooltip = document.getElementById("tooltip");

const data = (USAGE_DATA || [])
  .filter(d => d && typeof d.t === "number")
  .sort((a, b) => a.t - b.t);

const now = GENERATED_AT || Date.now();

function fmtTime(ms) {
  const d = new Date(ms);
  return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
function clamp(v) { return Math.max(0, Math.min(100, v)); }

function recompute() {
  const since = state.rangeMs ? now - state.rangeMs : 0;
  state.points = data.filter(d => d.t >= since);
  renderCards();
  draw();
}

function seriesStats(key) {
  const vals = state.points.map(p => clamp(p[key] ?? 0));
  if (!vals.length) return null;
  const current = vals[vals.length - 1];
  const peak = Math.max(...vals);
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  return { current, peak, avg };
}

function renderCards() {
  const el = document.getElementById("cards");
  el.innerHTML = "";
  for (const key of ["five_hour", "seven_day"]) {
    const s = seriesStats(key);
    const card = document.createElement("div");
    card.className = "card";
    const rows = s
      ? `<div class="stat"><span class="k">Current</span><span class="v">${s.current.toFixed(1)}%</span></div>
         <div class="stat"><span class="k">Peak</span><span class="v">${s.peak.toFixed(1)}%</span></div>
         <div class="stat"><span class="k">Average</span><span class="v">${s.avg.toFixed(1)}%</span></div>`
      : `<div class="stat"><span class="k">No data in range</span><span class="v">—</span></div>`;
    card.innerHTML = `<h3><span class="swatch" style="width:12px;height:12px;border-radius:3px;background:${COLORS[key]}"></span>${LABELS[key]} Utilization</h3>${rows}`;
    el.appendChild(card);
  }
}

function setupCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { w: rect.width, h: rect.height };
}

function plotGeom(w, h) {
  return {
    x0: PAD.left, y0: PAD.top,
    pw: w - PAD.left - PAD.right,
    ph: h - PAD.top - PAD.bottom,
  };
}

function xFor(t, g, minT, spanT) { return g.x0 + ((t - minT) / spanT) * g.pw; }
function yFor(v, g) { return g.y0 + g.ph - (clamp(v) / 100) * g.ph; }

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function draw() {
  const { w, h } = setupCanvas();
  const g = plotGeom(w, h);
  ctx.clearRect(0, 0, w, h);

  const grid = cssVar("--grid");
  const muted = cssVar("--muted");

  // Y gridlines + labels 0..100
  ctx.strokeStyle = grid; ctx.fillStyle = muted;
  ctx.lineWidth = 1; ctx.font = "11px system-ui, sans-serif";
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let pct = 0; pct <= 100; pct += 25) {
    const y = yFor(pct, g);
    ctx.beginPath(); ctx.moveTo(g.x0, y); ctx.lineTo(g.x0 + g.pw, y); ctx.stroke();
    ctx.fillText(pct + "%", g.x0 - 8, y);
  }

  if (state.points.length < 2) {
    document.querySelector(".chart-wrap").classList.add("is-empty");
    ctx.fillStyle = muted; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "14px system-ui, sans-serif";
    ctx.fillText("Not enough history in this range yet", g.x0 + g.pw / 2, g.y0 + g.ph / 2);
    return;
  }

  const minT = state.points[0].t;
  const maxT = state.points[state.points.length - 1].t;
  const spanT = Math.max(1, maxT - minT);

  // X ticks (5 evenly spaced)
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let i = 0; i <= 4; i++) {
    const t = minT + (spanT * i) / 4;
    const x = xFor(t, g, minT, spanT);
    const d = new Date(t);
    const label = state.rangeMs && state.rangeMs <= 86400000
      ? d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })
      : d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    ctx.fillStyle = muted;
    ctx.fillText(label, x, g.y0 + g.ph + 8);
  }

  // Honest rendering: plot ONLY real measured samples as dots — no lines
  // fabricated across gaps. Then overlay a computed trend line (centred
  // moving average) that is explicitly a derived analytic, not raw data.
  const trendWindow = trendWindowMs(state.rangeMs, spanT);

  for (const key of ["five_hour", "seven_day"]) {
    if (!state.visible[key]) continue;

    // raw samples — dots only
    ctx.fillStyle = COLORS[key];
    ctx.globalAlpha = 0.55;
    for (const p of state.points) {
      const x = xFor(p.t, g, minT, spanT);
      const y = yFor(p[key] ?? 0, g);
      ctx.beginPath(); ctx.arc(x, y, 1.8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // trend line — centred moving average over the real samples
    if (state.showTrend) {
      const trend = movingAverage(state.points, key, trendWindow);
      if (trend.length >= 2) {
        ctx.strokeStyle = COLORS[key]; ctx.lineWidth = 2.5;
        ctx.lineJoin = "round"; ctx.beginPath();
        trend.forEach((pt, i) => {
          const x = xFor(pt.t, g, minT, spanT);
          const y = yFor(pt.v, g);
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        });
        ctx.stroke();
      }
    }
  }
}

// Trend smoothing window. Wide enough to average through the 5-hour sawtooth
// (which resets every 5h) so the trend shows the underlying envelope, not the
// teeth. Scales with the visible range, floored at ~2.5h (half a 5h window).
function trendWindowMs(rangeMs, spanT) {
  const base = rangeMs || spanT;
  return Math.max(base / 24, 2.5 * 60 * 60 * 1000);
}

// Centred moving average: each output point is the mean of all real samples
// within ±windowMs/2. Derived from measured data only — never invents points
// where none exist, so gaps stay gaps.
function movingAverage(points, key, windowMs) {
  const out = [];
  const half = windowMs / 2;
  let lo = 0, hi = 0, sum = 0;
  for (let i = 0; i < points.length; i++) {
    const t = points[i].t;
    while (lo < points.length && points[lo].t < t - half) { sum -= (points[lo][key] ?? 0); lo++; }
    while (hi < points.length && points[hi].t <= t + half) { sum += (points[hi][key] ?? 0); hi++; }
    const n = hi - lo;
    if (n > 0) out.push({ t, v: sum / n });
  }
  return out;
}

// ---- hover crosshair + tooltip -------------------------------------------
function nearestIndex(px, g, minT, spanT) {
  const t = minT + ((px - g.x0) / g.pw) * spanT;
  let lo = 0, hi = state.points.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    state.points[mid].t < t ? (lo = mid + 1) : (hi = mid);
  }
  if (lo > 0 && Math.abs(state.points[lo - 1].t - t) < Math.abs(state.points[lo].t - t)) lo--;
  return lo;
}

canvas.addEventListener("mousemove", (e) => {
  if (state.points.length < 2) { tooltip.style.opacity = 0; return; }
  const rect = canvas.getBoundingClientRect();
  const { w, h } = { w: rect.width, h: rect.height };
  const g = plotGeom(w, h);
  const px = e.clientX - rect.left;
  if (px < g.x0 || px > g.x0 + g.pw) { tooltip.style.opacity = 0; return; }

  const minT = state.points[0].t;
  const maxT = state.points[state.points.length - 1].t;
  const spanT = Math.max(1, maxT - minT);
  const idx = nearestIndex(px, g, minT, spanT);
  const p = state.points[idx];

  draw();
  const x = xFor(p.t, g, minT, spanT);
  ctx.strokeStyle = cssVar("--crosshair"); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x, g.y0); ctx.lineTo(x, g.y0 + g.ph); ctx.stroke();
  for (const key of ["five_hour", "seven_day"]) {
    if (!state.visible[key]) continue;
    ctx.fillStyle = COLORS[key];
    ctx.beginPath(); ctx.arc(x, yFor(p[key] ?? 0, g), 3.5, 0, Math.PI * 2); ctx.fill();
  }

  let rows = "";
  for (const key of ["five_hour", "seven_day"]) {
    if (!state.visible[key]) continue;
    rows += `<div class="t-row"><span class="t-dot" style="background:${COLORS[key]}"></span>${LABELS[key]}: <b>${clamp(p[key] ?? 0).toFixed(1)}%</b></div>`;
  }
  tooltip.innerHTML = `<div class="t-time">${fmtTime(p.t)}</div>${rows}`;
  tooltip.style.opacity = 1;
  const tw = tooltip.offsetWidth;
  let left = x + 14;
  if (left + tw > w) left = x - tw - 14;
  tooltip.style.left = left + "px";
  tooltip.style.top = g.y0 + "px";
});
canvas.addEventListener("mouseleave", () => { tooltip.style.opacity = 0; draw(); });

// ---- controls -------------------------------------------------------------
document.getElementById("ranges").addEventListener("click", (e) => {
  const btn = e.target.closest("button"); if (!btn) return;
  document.querySelectorAll("#ranges button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  state.rangeMs = Number(btn.dataset.ms);
  recompute();
});
document.querySelectorAll(".legend .item[data-key]").forEach(item => {
  item.addEventListener("click", () => {
    const key = item.dataset.key;
    state.visible[key] = !state.visible[key];
    item.classList.toggle("off", !state.visible[key]);
    draw();
  });
});
document.getElementById("trend-toggle").addEventListener("click", (e) => {
  state.showTrend = !state.showTrend;
  e.currentTarget.classList.toggle("off", !state.showTrend);
  draw();
});
window.addEventListener("resize", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);

// ---- boot -----------------------------------------------------------------
document.getElementById("meta").textContent =
  data.length ? `${data.length} samples · generated ${fmtTime(now)}` : "no history yet";
document.getElementById("footer").textContent =
  "Colors: 5-Hour = orange (#E69F00), 7-Day = blue (#56B4E9) — Okabe-Ito colorblind-safe palette. Static snapshot; regenerate from the extension's Settings to refresh.";
recompute();
</script>
